<svg xmlns="http://www.w3.org/2000/svg" width="80.0" height="28" viewBox="0 0 80.0 28">
<style>
  @keyframes flyIn {
    0%, 2% { transform: translateY(28px); opacity: 0; }
    10% { transform: translateY(0); opacity: 1; }
    90% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
  .badge-anim {
    animation: flyIn 8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    animation-delay: 0.480s;
  }
</style>
<g class="badge-anim">
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="28" role="img" aria-label="MERA"><title>MERA</title><g shape-rendering="crispEdges"><rect width="80" height="28" fill="#4caf50"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="100"><image x="9" y="7" width="14" height="14" href="data:image/svg+xml;base64,"/><text transform="scale(.1)" x="500" y="175" textLength="360" font-weight="bold">MERA</text></g></svg>
</g>
</svg>