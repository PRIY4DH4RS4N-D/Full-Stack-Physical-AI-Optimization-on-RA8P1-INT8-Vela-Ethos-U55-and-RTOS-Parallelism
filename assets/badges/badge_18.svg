<svg xmlns="http://www.w3.org/2000/svg" width="178.0" height="28" viewBox="0 0 178.0 28">
<style>
  @keyframes flyIn {
    0%, 2% { transform: translateY(28px); opacity: 0; }
    10% { transform: translateY(0); opacity: 1; }
    90% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
  .badge-anim {
    animation: flyIn 8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    animation-delay: 1.080s;
  }
</style>
